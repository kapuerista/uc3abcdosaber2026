{% extends "base_template.html" %}

{% block title %}
<title>ABC do Saber - Cadastro de Tipo de Atividade</title>
{% endblock %}

{% block menu %}
<div class="collapse navbar-collapse justify-content-end" id="mynavbar">
    <div class="navbar-nav">

        <a href="/" class="nav-link">Início</a>

        <a href="{% url 'tipodeatividade:cadastro' %}" class="nav-link">Cadastrar</a>

        <a href="{% url 'tipodeatividade:listar' %}" class="nav-link">Listar</a>

    </div>
</div>
{% endblock %}

{% block corpo %}

<main class="container m-2 w-75 mx-auto">

    <div class="row">
        <div class="col text-center">
            <h2>Cadastro de Tipo de Atividade</h2>
        </div>
    </div>

    <form method="POST" id="idFrmCadastrarTiposAtividade">

    {% csrf_token %}

        <div class="form-group">
            <label for="idDescricao">Descrição</label>
            <input class="form-control"
                   type="text"
                   id="idDescricao"
                   name="descricao"
                   placeholder="Informe a descrição"
                   required>
        </div>

        <div class="form-group text-center">
            <input type="reset" value="Limpar" class="btn btn-secondary">
            <input type="submit" value="Cadastrar" class="btn btn-primary">
        </div>

    </form>

</main>

{% endblock %}
